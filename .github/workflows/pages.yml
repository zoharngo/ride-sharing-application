name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages

      - name: Enable GitHub Pages from gh-pages branch
        run: |
          # Try to create Pages site pointing to gh-pages branch
          CREATE_STATUS=$(curl -s -o /tmp/pages_create.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pages" \
            -d '{"source":{"branch":"gh-pages","path":"/"}}')
          echo "Create Pages response: $CREATE_STATUS"
          cat /tmp/pages_create.json

          if [ "$CREATE_STATUS" = "409" ]; then
            echo "Pages already exists, updating source..."
            curl -s -X PUT \
              -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${{ github.repository }}/pages" \
              -d '{"source":{"branch":"gh-pages","path":"/"}}'
          fi

          if [ "$CREATE_STATUS" = "201" ] || [ "$CREATE_STATUS" = "200" ] || [ "$CREATE_STATUS" = "409" ]; then
            echo "Pages configured successfully"
          else
            echo "Warning: Could not configure Pages via API (status: $CREATE_STATUS)"
            echo "You may need to enable Pages manually in repo Settings > Pages > Source: gh-pages branch"
          fi
